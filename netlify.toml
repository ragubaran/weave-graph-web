[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/internals"
  to = "/visualisation.html"
  status = 301

[[redirects]]
  from = "/internals.html"
  to = "/visualisation.html"
  status = 301

[[redirects]]
  from = "/visualization"
  to = "/visualisation.html"
  status = 200

[[redirects]]
  from = "/visualization.html"
  to = "/visualisation.html"
  status = 200

[[redirects]]
  from = "/visualisation"
  to = "/visualisation.html"
  status = 200
