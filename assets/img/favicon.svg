<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c471ed" />
      <stop offset="100%" stop-color="#f64f59" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <!-- Graph Edges -->
  <line x1="18" y1="20" x2="32" y2="44" stroke="#4facfe" stroke-width="2.5" stroke-opacity="0.8" />
  <line x1="46" y1="20" x2="32" y2="44" stroke="#c471ed" stroke-width="2.5" stroke-opacity="0.8" />
  <line x1="18" y1="20" x2="46" y2="20" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
  <line x1="32" y1="44" x2="32" y2="54" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.5" />
  <!-- Graph Nodes -->
  <circle cx="18" cy="20" r="7" fill="url(#brandGrad)" filter="url(#glow)" />
  <circle cx="46" cy="20" r="7" fill="url(#purpleGrad)" filter="url(#glow)" />
  <circle cx="32" cy="44" r="8" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="32" cy="44" r="4" fill="#0b0f19" />
  <circle cx="32" cy="54" r="3" fill="#4facfe" />
</svg>
